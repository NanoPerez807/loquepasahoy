name: Prueba de publicación
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: curl -sS -o /dev/null -w "publicación pedida: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
