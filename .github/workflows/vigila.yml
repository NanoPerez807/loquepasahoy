# Vigilante de cobros. GitHub se salta muchas veces el cron de cada 10 minutos (el 26-11 pasó de las 20:04 a las 23:50 UTC sin
# ejecutarse), así que este trabajo se queda despierto unas 5 h 40 min mirando Stripe cada 5 minutos y, al acabar, se vuelve a
# lanzar solo. El cron de cada hora lo rearranca si la cadena se corta. Mismo programa y mismas reglas que cobros.yml:
# necesita el secreto STRIPE_KEY (clave RESTRINGIDA, solo lectura de «Checkout Sessions») y nunca guarda datos de quien paga.
name: Vigila cobros
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: vigila
  cancel-in-progress: false
jobs:
  vigila:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Mira Stripe cada 5 minutos
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$STRIPE_KEY" ]; then echo "Falta el secreto STRIPE_KEY: no hago nada."; exit 0; fi
          git config user.name "robot-cobros"; git config user.email "robot-cobros@users.noreply.github.com"
          fin=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            if git fetch -q origin main && git reset -q --hard origin/main && python3 .github/cobros.py --stripe; then
              if git status --porcelain data/cobros.json data/cobros-libro.json | grep -q .; then
                git add data/cobros.json data/cobros-libro.json && git commit -q -m "Pagos nuevos" && git push -q origin HEAD:main && \
                  curl -sS -o /dev/null -w "publicación pedida: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "no se ha podido subir: se reintenta en 5 minutos"
              fi
            fi
            sleep 300
          done
      - name: Se vuelve a lanzar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vigila.yml -R "${{ github.repository }}" || echo "no se ha podido relanzar: lo hará el cron de cada hora"
