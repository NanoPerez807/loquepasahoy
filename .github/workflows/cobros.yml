# Robot de cobros: cada 10 minutos mira en Stripe los pagos nuevos (tuneos, pueblos de oro, vecinos de honor) y los pone en la web.
# Necesita el secreto STRIPE_KEY (Settings → Secrets and variables → Actions): una clave RESTRINGIDA de Stripe con permiso de
# lectura de «Checkout Sessions». Sin el secreto no hace nada. Nunca guarda datos de quien paga (ver .github/cobros.py).
name: Cobros
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: cobros
  cancel-in-progress: false
jobs:
  cobros:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Apunta los pagos nuevos
        id: apunta
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: |
          if [ -z "$STRIPE_KEY" ]; then echo "Falta el secreto STRIPE_KEY: no hago nada."; exit 0; fi
          python3 .github/cobros.py --stripe
          python3 .github/cobros.py --resumen
          if git status --porcelain data/cobros.json data/cobros-libro.json | grep -q .; then echo "hay=si" >> "$GITHUB_OUTPUT"; fi
      - name: Sube los cambios y pide que se publique la web
        if: steps.apunta.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "robot-cobros"
          git config user.email "robot-cobros@users.noreply.github.com"
          git add data/cobros.json data/cobros-libro.json
          git commit -q -m "Pagos nuevos"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then break; fi
            [ "$i" = 3 ] && exit 1; sleep 7
          done
          # los commits del robot no publican la web solos: se pide una publicación
          curl -sS -o /dev/null -w "publicación pedida: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
